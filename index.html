
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIP Coffee Rush</title>
<style>
body {
  background: #101010;
  color: #e6c77a;
  font-family: Tahoma, sans-serif;
  text-align: center;
  padding: 30px 15px;
}
.card {
  background: #1b1b1b;
  border: 1px solid #b8954a;
  border-radius: 20px;
  padding: 25px;
  max-width: 400px;
  margin: auto;
}
button {
  background: #d7b56d;
  color: #111;
  border: 0;
  border-radius: 12px;
  padding: 15px 25px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="card">
<h1>CIP COFFEE RUSH ☕</h1>
<p>باشگاه مشتریان کافه CIP</p>
<h2>دانه‌های قهوه: <span id="score">0</span></h2>
<button onclick="addBean()">جمع کردن دانه ☕</button>
<p id="message">به بازی خوش آمدی!</p>
</div>
<script>
let score = 0;
function addBean() {
  score++;
  document.getElementById('score').textContent = score;
  document.getElementById('message').textContent = 'آفرین! یک دانه جمع کردی.';
}
</script>
</body>
</html>
